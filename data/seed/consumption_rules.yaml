# Seed consumption assumptions, keyed by (garment_id, silhouette_id) at a
# Medium reference size and 112cm (~44in) reference width. Starting
# assumptions a boutique can override -- not universal manufacturing truths
# (see docs/rule-engine.md). Combos not listed here fall back to a wide,
# low-confidence generic band rather than fabricated precision -- see
# calculate_consumption's fallback behavior.
#
# `source` is one of:
#   seed              -- a rough starting assumption, not independently verified.
#   curated           -- cross-checked against a named real-world reference point
#                        (here: the product brief's own worked examples).
#   boutique_override -- supplied by a specific boutique, not present in this seed set.
#
# Only (garment, silhouette) pairs that are valid per data/seed/silhouettes.yaml's
# applicable_garment_ids are listed -- no rule exists for a combination the
# ontology itself doesn't allow.
consumption_rules:
  - {garment_id: blouse, silhouette_id: draped, base_metres: 1.0, lining_modifier_m: 0.3, wastage_allowance_pct: 0.10, confidence: 0.85, source: curated, notes: "Matches the product brief's own 'Medium blouse ~1m' example."}
  - {garment_id: saree, silhouette_id: draped, base_metres: 5.5, wastage_allowance_pct: 0.03, confidence: 0.85, source: seed}
  - {garment_id: pre_draped_saree, silhouette_id: pre_draped, base_metres: 5.5, wastage_allowance_pct: 0.06, confidence: 0.75, source: seed}
  - {garment_id: saree_gown, silhouette_id: pre_draped, base_metres: 5.5, lining_modifier_m: 1.5, wastage_allowance_pct: 0.08, confidence: 0.65, source: seed}

  - {garment_id: kurta_set, silhouette_id: relaxed, base_metres: 2.5, wastage_allowance_pct: 0.06, confidence: 0.8, source: seed}
  - {garment_id: kurta_set, silhouette_id: straight, base_metres: 2.5, wastage_allowance_pct: 0.06, confidence: 0.8, source: seed}

  - {garment_id: suit, silhouette_id: straight, base_metres: 3.0, lining_modifier_m: 0.0, wastage_allowance_pct: 0.06, confidence: 0.8, source: seed}
